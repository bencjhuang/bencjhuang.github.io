<style>
  :root{
    color-scheme:light;
    --bg:#EEF1F5; --surface:#FFFFFF; --surface-2:#F5F7FA;
    --ink:#0F1E2D; --muted:#5B6E80; --faint:#8899A8; --line:#DCE3EB;
    --brand:#0B5FA5; --brand-deep:#083F6E; --accent:#0E9384;
    --shadow:0 1px 2px rgba(15,30,45,.06), 0 12px 32px -12px rgba(15,30,45,.18);
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box}
  img{max-width:100%}
  [hidden]{display:none!important}
  body{
    margin:0;
    background:var(--bg); color:var(--ink);
    font-family:"IBM Plex Sans","Noto Sans TC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:520px;margin:0 auto;padding-inline:16px;padding-block:20px 40px;display:flex;flex-direction:column;gap:18px}
  .topbar{display:flex;justify-content:flex-end;align-items:center;gap:8px}
  .lang{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;box-shadow:var(--shadow)}
  .lang button{font:inherit;font-size:13px;font-weight:500;letter-spacing:.02em;color:var(--muted);background:none;border:0;border-radius:999px;padding:5px 14px;cursor:pointer}
  .lang button[aria-pressed="true"]{background:var(--brand);color:#fff}
  .lang button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
  .crest{background:linear-gradient(105deg,var(--brand-deep) 0%,var(--brand) 62%,#1C7FC4 100%);color:#fff;padding:16px 20px;display:flex;flex-direction:column;gap:2px}
  .crest .zh{font-family:"Noto Serif TC",serif;font-weight:700;font-size:19px;letter-spacing:.16em}
  .crest .en{font-size:11px;font-weight:500;letter-spacing:.07em;color:#CFE4F6;text-transform:uppercase}

  .identity{padding:22px 20px 20px;display:flex;flex-direction:column;gap:14px}
  .name{font-family:"Source Serif 4","Noto Serif TC",serif;font-weight:600;font-size:clamp(28px,8vw,34px);line-height:1.15;margin:0;text-wrap:balance}
  .name[data-lang="zh"]{letter-spacing:.14em}
  .name .deg{font-family:"IBM Plex Sans","Noto Sans TC",sans-serif;font-size:14px;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:.45em;white-space:nowrap}
  .roles{display:flex;flex-direction:column;gap:3px;margin:0;padding:0;list-style:none}
  .roles li{color:var(--muted);font-size:14.5px}
  .roles li.lead{color:var(--ink);font-weight:500}
  .fellow{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;letter-spacing:.02em;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);background:color-mix(in srgb,var(--accent) 9%,transparent);border-radius:999px;padding:4px 11px}
  .fellow::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent)}

  .actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:0 20px 20px}
  .btn{display:flex;align-items:center;justify-content:center;gap:7px;font:inherit;font-size:14px;font-weight:500;text-decoration:none;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:10px;padding:11px 12px;cursor:pointer;transition:background .15s ease,border-color .15s ease}
  .btn:hover{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 8%,var(--surface-2))}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.primary:hover{background:var(--brand-deep);border-color:var(--brand-deep)}
  .btn svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .btn.wide{grid-column:1 / -1}

  .details{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px 20px}
  .row{display:flex;gap:14px;align-items:baseline;padding:13px 0;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .row dt{flex:none;width:74px;font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin:0}
  .row dd{margin:0;flex:1;min-width:0;word-break:break-word}
  .row dd a{color:var(--brand);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--brand) 35%,transparent)}
  .row dd a:hover{border-bottom-color:var(--brand)}
  .row dd.tel{font-variant-numeric:tabular-nums}

  .qrblock{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:22px 20px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
  .qrblock h2{margin:0;font-family:"Source Serif 4","Noto Serif TC",serif;font-size:17px;font-weight:600}
  .qrblock p{margin:0;font-size:13px;color:var(--muted);max-width:34ch}
  #qr{background:#fff;padding:12px;border-radius:10px;border:1px solid var(--line);line-height:0}
  #qr img,#qr canvas{display:block;width:180px;height:180px}

  .foot{text-align:center;font-size:12px;color:var(--faint);letter-spacing:.02em}
  .toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(8px);background:var(--ink);color:var(--bg);font-size:13px;font-weight:500;padding:9px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;z-index:20}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
(function(){
  var VCARD = [
    "BEGIN:VCARD","VERSION:3.0",
    "N:Huang;Chen-Jui;;;Ph.D.",
    "FN:Chen-Jui (Ben) Huang",
    "ORG:National Taiwan University of Science and Technology;Department of Chemical Engineering",
    "TITLE:Assistant Professor",
    "TEL;TYPE=WORK,VOICE:+886227376618",
    "EMAIL;TYPE=WORK:cjhuang@mail.ntust.edu.tw",
    "URL:https://bencjhuang.github.io/",
    "ADR;TYPE=WORK:;;No. 43 Sec. 4 Keelung Rd. Da-an Dist.;Taipei;;106335;Taiwan",
    "NOTE:Yushan Young Fellow",
    "END:VCARD"
  ].join("\n");

  var nodes = document.querySelectorAll("[data-zh][data-en]");
  var btnZh = document.getElementById("btn-zh");
  var btnEn = document.getElementById("btn-en");
  var nameEl = document.getElementById("name");
  var NAME = { zh:"黃貞睿", en:"Chen-Jui (Ben) Huang" };

  function setLang(lang){
    nodes.forEach(function(n){ n.textContent = n.getAttribute("data-" + lang); });
    nameEl.setAttribute("data-lang", lang);
    nameEl.firstChild.nodeValue = NAME[lang];
    document.documentElement.lang = (lang === "zh") ? "zh-Hant" : "en";
    btnZh.setAttribute("aria-pressed", lang === "zh");
    btnEn.setAttribute("aria-pressed", lang === "en");
    try{ localStorage.setItem("cardLang", lang); }catch(e){}
  }
  btnZh.addEventListener("click", function(){ setLang("zh"); });
  btnEn.addEventListener("click", function(){ setLang("en"); });

  var saved = null;
  try{ saved = localStorage.getItem("cardLang"); }catch(e){}
  setLang(saved === "en" || saved === "zh" ? saved
        : ((navigator.language||"").toLowerCase().indexOf("zh") === 0 ? "zh" : "en"));

  var toast = document.getElementById("toast"), tid;
  function say(msg){
    toast.textContent = msg;
    toast.classList.add("on");
    clearTimeout(tid);
    tid = setTimeout(function(){ toast.classList.remove("on"); }, 1900);
  }

  var PLAIN_ZH = "黃貞睿 博士\n國立臺灣科技大學 化學工程系 助理教授／玉山青年學者\n辦公室：+886-2-2737-6618\nEmail：cjhuang@mail.ntust.edu.tw\n地址：106335 臺北市大安區基隆路四段 43 號\n網站：https://bencjhuang.github.io/";
  var PLAIN_EN = "Chen-Jui (Ben) Huang, Ph.D.\nAssistant Professor, Dept. of Chemical Engineering, Taiwan Tech\nYushan Young Fellow\nOffice: +886-2-2737-6618\nEmail: cjhuang@mail.ntust.edu.tw\nAddress: No. 43, Sec. 4, Keelung Rd., Da'an Dist., Taipei 106335, Taiwan\nWeb: https://bencjhuang.github.io/";

  document.getElementById("copy").addEventListener("click", function(){
    var zh = btnZh.getAttribute("aria-pressed") === "true";
    var text = zh ? PLAIN_ZH : PLAIN_EN;
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(
        function(){ say(zh ? "已複製聯絡資訊" : "Contact details copied"); },
        function(){ say(zh ? "複製失敗，請長按選取" : "Copy failed — select manually"); }
      );
    } else {
      say(zh ? "此瀏覽器不支援複製" : "Clipboard unavailable here");
    }
  });

  document.getElementById("share").addEventListener("click", function(){
    var zh = btnZh.getAttribute("aria-pressed") === "true";
    var url = location.href;
    var title = zh ? "黃貞睿 博士 電子名片" : "Chen-Jui (Ben) Huang — Digital Card";
    if (navigator.share){
      navigator.share({ title: title, url: url }).catch(function(){});
    } else if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(function(){
        say(zh ? "已複製名片網址" : "Card link copied");
      }, function(){ say(zh ? "請手動複製網址" : "Copy the link manually"); });
    } else {
      say(zh ? "請手動複製網址" : "Copy the link manually");
    }
  });
})();
</script>
