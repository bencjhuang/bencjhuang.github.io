[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "echem-plots"
version = "0.1.0"
description = "Publication-quality electrochemistry plots for battery research"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.22",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mpl",       # optional: pixel-level figure regression tests
]

[tool.setuptools.packages.find]
where = ["."]
include = ["echem_plots*"]
